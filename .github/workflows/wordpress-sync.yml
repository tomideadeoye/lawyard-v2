name: WordPress → site sync

# Keeps the news site current while WordPress is still the editorial source.
# Runs the same code path as the app (app/api/sync/wordpress) every 15 minutes.
# Remove this workflow once the domain cutover retires WordPress.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: wordpress-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SYNC_URL or CRON_SECRET is not set — skipping."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_URL/api/sync/wordpress"
