name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checks that catch the failures this repo has actually shipped: a type error,
# a broken unit, docs that drifted from their registry, or a registry row that
# no longer points at real code. Deploys stay on Vercel.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test:unit

      - name: Docs gate
        run: pnpm run docs:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint
