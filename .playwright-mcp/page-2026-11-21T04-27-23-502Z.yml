      - region "Pricing FAQs" [ref=f18e1270]:
        - generic [ref=f18e1272]:
          - heading "Pricing FAQs" [level=2] [ref=f18e1275]
          - generic [ref=f18e1276]:
            - generic [ref=f18e1277]:
              - generic [ref=f18e1278]:
                - heading [level=3] [ref=f18e1279]:
                  - button "What is a seat?" [expanded] [ref=f18e1280] [cursor=pointer]
                - generic [ref=f18e1284]:
                  - paragraph [ref=f18e1285]: Seats give users access to Figma’s products. The different seats are designed to support different user workflows.
                  - paragraph [ref=f18e1286]:
                    - text: The
                    - strong [ref=f18e1287]: Full seat
                    - text: includes full access to all Figma products, including Figma Design, Figma Make, Figma Draw, Figma Motion, Figma Sites, Dev Mode, FigJam, Figma Slides, Figma Buzz, and Figma Specs.
                  - paragraph [ref=f18e1288]:
                    - text: The
                    - strong [ref=f18e1289]: Dev seat
                    - text: includes full access to Dev Mode, FigJam, Figma Slides, Figma Buzz, and Figma Specs. It also gives users view and comment access in Figma Design files.
                  - paragraph [ref=f18e1290]:
                    - text: The
                    - strong [ref=f18e1291]: Collab seat
                    - text: includes full access to FigJam, Figma Slides, Figma Buzz, and Figma Specs. It also gives users view and comment access in Figma Design files. It only includes
                    - link "basic inspection" [ref=f18e1292] [cursor=pointer]:
                      - /url: https://help.figma.com/hc/en-us/articles/22012921621015-Guide-to-inspecting
                    - text: on Dev Mode.
                  - paragraph [ref=f18e1293]:
                    - text: If you’re on a paid plan, you can also let others view and comment on your files without purchasing extra seats. This view and comment access only includes
                    - link "basic inspection" [ref=f18e1294] [cursor=pointer]:
                      - /url: https://help.figma.com/hc/en-us/articles/22012921621015-Guide-to-inspecting
                    - text: on Dev Mode.
              - generic [ref=f18e1295]:
                - heading [level=3] [ref=f18e1296]:
                  - button "Where can I see a breakdown of my billing?" [expanded] [ref=f18e1297] [cursor=pointer]
                - paragraph [ref=f18e1302]:
                  - text: Only organization admins and billing group admins are able to view and manage billing. You can view a breakdown of your bill and manage seats from the Admin Dashboard in product.
                  - link "Learn more about billing" [ref=f18e1303] [cursor=pointer]:
                    - /url: https://help.figma.com/hc/en-us/articles/29717597009431-Guide-to-billing-at-Figma
              - generic [ref=f18e1304]:
                - heading [level=3] [ref=f18e1305]:
                  - button "What happens if I add seats mid-year on an annual plan?" [expanded] [ref=f18e1306] [cursor=pointer]
                - generic [ref=f18e1310]:
                  - paragraph [ref=f18e1311]: This depends on which plan you’re on.
                  - paragraph [ref=f18e1312]:
                    - text: If you’re on a
                    - strong [ref=f18e1313]: Professional
                    - text: plan, if you add new paid seats to your team during your annual subscription term, Figma charges you a separate monthly subscription for those seats at the monthly price.
                  - paragraph [ref=f18e1314]: Once an admin approves a new seat, it will be automatically added to your next monthly invoice. The cost of the seat will be prorated based on the day it was approved until the end of your current monthly billing term.
                  - paragraph [ref=f18e1315]: You will continue to get monthly invoices for newly added seats unless you proactively add those seats to your annual subscription or remove the seats.
                  - paragraph [ref=f18e1316]:
                    - text: If you’re on an
                    - strong [ref=f18e1317]: Organization
                    - text: or
                    - strong [ref=f18e1318]: Enterprise
                    - text: plan, admins need to approve new seats that incur costs. By default, approved seats are included in your next invoice with prorated pricing, based on the date they were approved until the end of the annual subscription term. You’ll be invoiced quarterly for new seats added during your annual subscription term.
              - generic [ref=f18e1319]:
                - heading [level=3] [ref=f18e1320]:
                  - button "Can I purchase products individually?" [expanded] [ref=f18e1321] [cursor=pointer]
                - paragraph [ref=f18e1326]: We don’t offer the option to purchase products individually, but you can choose a plan and seats based on the products you’d like to use.
              - generic [ref=f18e1327]:
                - heading [level=3] [ref=f18e1328]:
                  - button "Can I inspect files without Dev Mode?" [expanded] [ref=f18e1329] [cursor=pointer]
                - paragraph [ref=f18e1334]:
                  - text: Yes, you can access inspect information as a free viewer. While you will have view-only access, you will be able to view measurements and property values, copy CSS, iOS, and Android code, export assets, comment on files, and collaborate via cursor chat.
                  - link "Learn more" [ref=f18e1335] [cursor=pointer]:
                    - /url: https://help.figma.com/hc/en-us/articles/22012921621015-Guide-to-inspecting
              - generic [ref=f18e1336]:
                - heading [level=3] [ref=f18e1337]:
                  - button "What are AI credits and how do they work?" [expanded] [ref=f18e1338] [cursor=pointer]
                - generic [ref=f18e1342]:
                  - paragraph [ref=f18e1343]: Figma AI uses a credit system that is shared across all Figma AI features and products. Every seat in Figma includes a monthly allotment of AI credits. The number of credits and which features you can use them with depends on your plan and seat type.
                  - paragraph [ref=f18e1344]: "Full seats include:"
                  - list [ref=f18e1345]:
                    - listitem [ref=f18e1346]: 3,000 credits/month on the Professional plan
                    - listitem [ref=f18e1347]: 3,500 credits/month on the Organization plan
                    - listitem [ref=f18e1348]: 4,250 credits/month on the Enterprise plan
                  - paragraph [ref=f18e1349]: All other seats (Collab, Dev, and View) and users on the Starter plan receive 500 credits/month.
                  - paragraph [ref=f18e1350]:
                    - text: If you need more credits, you can purchase additional AI credits on your plan. For more details, check out
                    - link "our Help Center article" [ref=f18e1351] [cursor=pointer]:
                      - /url: https://help.figma.com/hc/en-us/articles/33459875669015-How-AI-credits-work
                    - text: on how AI credits work.
              - generic [ref=f18e1352]:
                - heading [level=3] [ref=f18e1353]:
                  - button "Is Figma available for government or public sector teams?" [expanded] [ref=f18e1354] [cursor=pointer]
                - paragraph [ref=f18e1359]:
                  - text: Yes! You can learn more on
                  - link "figma.com/government" [ref=f18e1360] [cursor=pointer]:
                    - /url: https://www.figma.com/government/
                  - text: .
              - generic [ref=f18e1361]:
                - heading [level=3] [ref=f18e1362]:
                  - button "How do I downgrade or cancel my paid plan?" [expanded] [ref=f18e1363] [cursor=pointer]
                - paragraph [ref=f18e1368]:
                  - text: If you’re on the Professional plan, you can downgrade or cancel your plan your Admin Dashboard. If you’re on an Organization or Enterprise plan, please contact our Sales team to downgrade or cancel your plan.
                  - link "Learn more" [ref=f18e1369] [cursor=pointer]:
                    - /url: https://help.figma.com/hc/en-us/articles/360046216313-Upgrade-or-downgrade-your-plan
              - generic [ref=f18e1370]:
                - heading [level=3] [ref=f18e1371]:
                  - button "Where can I learn more about security on Figma?" [expanded] [ref=f18e1372] [cursor=pointer]
                - paragraph [ref=f18e1377]:
                  - text: We follow extensive security practices to to protect your data and privacy. All plans meet recognized international security, privacy, and compliance standards. Learn more on
                  - link "figma.com/security" [ref=f18e1378] [cursor=pointer]:
                    - /url: https://www.figma.com/security/
                  - text: .
              - generic [ref=f18e1379]:
                - heading [level=3] [ref=f18e1380]:
                  - button "Do you have a discount for schools or classrooms?" [expanded] [ref=f18e1381] [cursor=pointer]
                - paragraph [ref=f18e1386]:
                  - text: Yes! Learn more on
                  - link "figma.com/education" [ref=f18e1387] [cursor=pointer]:
                    - /url: https://www.figma.com/education/
                  - text: .
            - link "See more FAQs" [ref=f18e1389] [cursor=pointer]:
